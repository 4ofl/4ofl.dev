name: Auto-Compile Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - "resume/resume-data.json"
      - "scripts/build-resume.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Resume PDF
        run: node scripts/build-resume.js

      - name: Upload Resume Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            resume.pdf
            assets/aby_mathew_resume.pdf

