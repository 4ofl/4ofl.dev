<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 · lost in retrieval · 4ofl</title>
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="robots" content="noindex,follow" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url("./assets/fonts/bricolage-grotesque.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url("./assets/fonts/jetbrains-mono-400.woff2") format("woff2");
      }
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.22s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }

      :root {
        --ink: #0b0b0d;
        --bone: #edece8;
        --mist: #8c8a85;
        --line: #ffffff1a;
        --accent: #d47455;
        --pad: clamp(1.25rem, 5vw, 4rem);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        background: var(--ink);
        scroll-behavior: smooth;
      }
      body {
        min-height: 100svh;
        color: var(--bone);
        font:
          400 0.85rem/1.6 "JetBrains Mono",
          ui-monospace,
          monospace;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent);
        color: var(--ink);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Original standalone logo */
      .logo {
        position: fixed;
        top: 1.25rem;
        left: var(--pad);
        z-index: 20;
        font:
          800 1.3rem "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.04em;
        color: var(--bone);
      }
      .logo i {
        font-style: normal;
        color: var(--accent);
      }

      /* Fullscreen layout */
      .hero-404 {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: clamp(2rem, 5vw, 4.5rem);
        align-items: center;
        padding: 5rem var(--pad) 3rem;
      }

      .meta-col {
        display: grid;
        gap: 1.2rem;
        align-content: center;
      }
      .code {
        font:
          300 clamp(6rem, 16vw, 12rem)/0.8 "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.06em;
        user-select: none;
      }
      .code span {
        display: inline-block;
        transition:
          font-variation-settings 0.15s,
          color 0.2s;
      }
      h1 {
        font:
          600 clamp(1.8rem, 4vw, 2.8rem)/1.15 "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.03em;
      }
      h1 i {
        color: var(--accent);
        font-style: normal;
      }
      .sub {
        color: var(--mist);
        max-width: 44ch;
        line-height: 1.6;
      }
      .quick-nav {
        margin-top: 0.4rem;
      }
      .btn-main {
        display: inline-block;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
        padding: 0.45rem 1.1rem;
        border-radius: 99px;
        background: var(--accent);
        color: var(--ink);
        font-weight: 500;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .btn-main:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      /* Solid opaque terminal surface */
      .term-col {
        width: 100%;
      }
      .term {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #121215;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        padding: 1.3rem;
        display: grid;
        gap: 0.9rem;
        position: relative;
        z-index: 2;
      }
      .term-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.65rem;
        font-size: 0.75rem;
        color: var(--mist);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      #out {
        display: grid;
        gap: 0.3rem;
        min-height: 12rem;
        max-height: 19rem;
        overflow-y: auto;
        color: var(--mist);
        word-break: break-word;
        padding-top: 0.25rem;
        padding-right: 0.5rem;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      #out::-webkit-scrollbar {
        width: 5px;
      }
      #out::-webkit-scrollbar-track {
        background: transparent;
      }
      #out::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }
      #out::-webkit-scrollbar-thumb:hover {
        background: var(--mist);
      }
      #out .c {
        color: var(--bone);
      }
      #out .e {
        color: var(--accent);
      }
      #out a {
        color: var(--accent);
        text-decoration: underline;
      }

      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }
      .row span {
        color: var(--accent);
      }
      .row input {
        flex: 1;
        background: none;
        border: 0;
        outline: 0;
        color: inherit;
        font: inherit;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .chips button {
        background: #18181c;
        color: var(--mist);
        font: inherit;
        font-size: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 0.3rem 0.8rem;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .chips button:hover {
        border-color: var(--accent);
        color: var(--bone);
      }

      @media (max-width: 880px) {
        .hero-404 {
          grid-template-columns: 1fr;
          padding-top: 5rem;
          gap: 2rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <a class="logo" href="/">4ofl<i>.dev</i></a>

    <main class="hero-404">
      <div class="meta-col">
        <div class="code" id="code" aria-label="404">404</div>
        <h1>lost in <i>retrieval</i>.</h1>
        <p class="sub">
          zero documents matched this route. type a command in the terminal
          below, or jump back to an active route.
        </p>
        <div class="quick-nav">
          <a href="/" class="btn-main" id="homeBtn">home ↗</a>
        </div>
      </div>

      <div class="term-col">
        <div class="term">
          <div class="term-head">
            <span>index gateway</span>
            <span class="status-dot"></span>
          </div>
          <div id="out" aria-live="polite"></div>
          <div class="row">
            <span>&gt;</span>
            <input
              id="in"
              placeholder="try: help"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Terminal input"
            />
          </div>
          <div class="chips" id="chips">
            <button>help</button>
            <button>ls</button>
            <button>cd work</button>
            <button>home</button>
            <button>neofetch</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      (() => {
        "use strict";
        const $ = (s) => document.querySelector(s),
          out = $("#out"),
          inp = $("#in");
        const R = [
          ["home", "/"],
          ["work", "/#work"],
          ["about", "/#about"],
          ["contact", "/#contact"],
          ["citecamp", "https://citecamp.4ofl.dev"],
          ["june", "https://docs.june.4ofl.dev"],
          ["github", "https://github.com/4ofl"],
        ];
        const lev = (a, b) => {
          const d = Array.from({ length: a.length + 1 }, (_, i) => [
            i,
            ...Array(b.length).fill(0),
          ]);
          for (let j = 1; j <= b.length; j++) d[0][j] = j;
          for (let i = 1; i <= a.length; i++)
            for (let j = 1; j <= b.length; j++)
              d[i][j] = Math.min(
                d[i - 1][j] + 1,
                d[i][j - 1] + 1,
                d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
              );
          return d[a.length][b.length];
        };
        const line = (t, c) => {
          const d = document.createElement("div");
          d.textContent = t;
          if (c) d.className = c;
          out.append(d);
          out.scrollTop = 1e9;
          return d;
        };
        const link = (label, href) => {
          const d = document.createElement("div"),
            a = document.createElement("a");
          a.href = href;
          a.textContent = label;
          if (href[0] !== "/") {
            a.target = "_blank";
            a.rel = "noopener";
          }
          d.append("→ ", a);
          out.append(d);
          out.scrollTop = 1e9;
        };
        const go = (href) => {
          if (href[0] === "/") {
            if (document.startViewTransition) {
              document.startViewTransition(() => {
                location.href = href;
              });
            } else {
              location.href = href;
            }
          } else {
            open(href, "_blank", "noopener");
          }
        };

        const homeBtn = $("#homeBtn");
        if (homeBtn) {
          homeBtn.onclick = (e) => {
            if (document.startViewTransition) {
              e.preventDefault();
              document.startViewTransition(() => {
                location.href = "/";
              });
            }
          };
        }

        const path = location.pathname,
          seg = decodeURIComponent(path.split("/").filter(Boolean).pop() || "")
            .toLowerCase()
            .replace(/\.\w+$/, "");
        line("> GET " + path, "c");
        line("< 404 NOT_FOUND [route_unresolved]", "e");
        line("< 0 documents retrieved");
        let best = null,
          bd = 99;
        for (const r of R) {
          const d = Math.min(
            lev(seg, r[0]),
            r[0].startsWith(seg) && seg ? 0 : 99,
          );
          if (d < bd) {
            bd = d;
            best = r;
          }
        }
        if (seg && best && bd <= Math.max(2, seg.length / 2)) {
          line(`closest match: "${best[0]}" (distance ${bd})`);
          link(best[0], best[1]);
        } else {
          line("no close match. returning you home is the safest bet.");
          link("home", "/");
        }

        const cmdHistory = [];
        let histIdx = -1;
        const CMDS = [
          "help",
          "ls",
          "cd",
          "home",
          "neofetch",
          "specs",
          "whoami",
          "date",
          "clear",
        ];

        const run = (raw) => {
          const c = raw.trim();
          if (!c) return;
          line("> " + c, "c");
          if (!cmdHistory.length || cmdHistory[cmdHistory.length - 1] !== c) {
            cmdHistory.push(c);
          }
          histIdx = cmdHistory.length;
          const [cmd, ...a] = c.toLowerCase().split(/\s+/),
            arg = a.join(" ");
          if (cmd === "help")
            line(
              "help · ls · cd <route> · home · neofetch · whoami · date · clear",
            );
          else if (cmd === "ls") R.forEach((r) => line("  " + r[0]));
          else if (cmd === "cd" || cmd === "open") {
            const r =
              R.find((x) => x[0] === arg) ||
              R.map((x) => [x, lev(arg, x[0])]).sort(
                (p, q) => p[1] - q[1],
              )[0]?.[0];
            if (!arg) line("cd: where to?", "e");
            else {
              line("resolving " + r[0] + "…");
              setTimeout(() => go(r[1]), 350);
            }
          } else if (cmd === "home") {
            line("returning…");
            setTimeout(() => go("/"), 300);
          } else if (cmd === "neofetch" || cmd === "specs") {
            const pre = document.createElement("pre");
            pre.style.cssText =
              "font:inherit;margin:0.35rem 0;line-height:1.45;color:var(--bone);overflow-x:auto;";
            pre.innerHTML = `<span style="color:var(--accent);font-weight:bold;">
  ██╗  ██╗ ██████╗ ███████╗██╗     
  ██║  ██║██╔═══██╗██╔════╝██║     
  ███████║██║   ██║█████╗  ██║     
  ╚════██║██║   ██║██╔══╝  ██║     
       ██║╚██████╔╝██║     ███████╗
       ╚═╝ ╚═════╝ ╚═╝     ╚══════╝</span>

  <span style="color:var(--mist);">os:</span>      Arch Linux · Edge Runtime
  <span style="color:var(--mist);">host:</span>    Kerala, IN (Asia/Kolkata)
  <span style="color:var(--mist);">uptime:</span>  41d 6h
  <span style="color:var(--mist);">shell:</span>   4ofl-gw v1.4
  <span style="color:var(--mist);">stack:</span>   Python, C, SQLite, Docker, Node.js
  <span style="color:var(--mist);">focus:</span>   local-first, RAG pipelines, edge AI
  <span style="color:var(--mist);">status:</span>  violently opposed to legacy software`;
            out.append(pre);
            out.scrollTop = 1e9;
          } else if (cmd === "whoami")
            line(
              "a visitor on a route that doesn't exist. aby mathew built this index.",
            );
          else if (cmd === "date") line(new Date().toISOString());
          else if (cmd === "clear") out.innerHTML = "";
          else if (cmd === "sudo")
            line("nice try. this index is read-only.", "e");
          else if (cmd === "rm")
            line(
              "rm: refusing. you already found one thing that's missing.",
              "e",
            );
          else {
            const m = CMDS.map((x) => [x, lev(cmd, x)]).sort(
              (p, q) => p[1] - q[1],
            )[0];
            line(
              `${cmd}: command not found${m[1] <= 2 ? ` · did you mean "${m[0]}"?` : ""}`,
              "e",
            );
          }
        };
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            run(inp.value);
            inp.value = "";
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            if (cmdHistory.length && histIdx > 0) {
              histIdx--;
              inp.value = cmdHistory[histIdx];
            }
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            if (histIdx < cmdHistory.length - 1) {
              histIdx++;
              inp.value = cmdHistory[histIdx];
            } else {
              histIdx = cmdHistory.length;
              inp.value = "";
            }
          } else if (e.key === "Tab") {
            e.preventDefault();
            const val = inp.value.trim().toLowerCase();
            if (val.startsWith("cd ")) {
              const target = val.slice(3).trim();
              const match = R.find((r) => r[0].startsWith(target));
              if (match) inp.value = "cd " + match[0];
            } else if (val) {
              const match = CMDS.find((cmd) => cmd.startsWith(val));
              if (match) inp.value = match + (match === "cd" ? " " : "");
            }
          }
        });
        $("#chips").addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON") run(e.target.textContent);
        });
        addEventListener("keydown", (e) => {
          if (e.key === "Escape") go("/");
        });
        if (matchMedia("(pointer:fine)").matches) inp.focus();

        /* big 404 reacts to cursor + dot grid */
        const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
        const code = $("#code");
        code.innerHTML = [..."404"].map((c) => `<span>${c}</span>`).join("");
        const S = [...code.children];

        let mx = -999,
          my = -999;
        const cv = $("#bg"),
          g = cv.getContext("2d");
        let W, H, D;
        const size = () => {
          D = Math.min(devicePixelRatio || 1, 2);
          W = cv.width = innerWidth * D;
          H = cv.height = innerHeight * D;
        };
        size();
        addEventListener(
          "resize",
          () => {
            size();
            requestFrame();
          },
          { passive: true },
        );

        let animPending = false;
        function requestFrame() {
          if (!animPending && !reduce) {
            animPending = true;
            requestAnimationFrame(frame);
          }
        }

        function frame() {
          animPending = false;
          g.clearRect(0, 0, W, H);
          const gap = 34 * D;
          const radius = 1 * D;
          const twoPi = 6.2831853;
          const hoverDist = 230;

          g.fillStyle = "rgba(255,255,255,.09)";
          g.beginPath();
          const startX = (W % gap) / 2 || gap / 2;
          const startY = (H % gap) / 2 || gap / 2;
          const active = [];

          for (let y = startY; y < H; y += gap) {
            for (let x = startX; x < W; x += gap) {
              const dist = Math.hypot(x / D - mx, y / D - my);
              if (dist < hoverDist) {
                active.push({ x, y, k: 1 - dist / hoverDist });
              } else {
                g.moveTo(x + radius, y);
                g.arc(x, y, radius, 0, twoPi);
              }
            }
          }
          g.fill();

          for (let i = 0; i < active.length; i++) {
            const dot = active[i];
            g.fillStyle = `rgba(212,116,85,${0.2 + 0.8 * dot.k})`;
            g.beginPath();
            g.arc(dot.x, dot.y, (1 + 2.4 * dot.k) * D, 0, twoPi);
            g.fill();
          }

          for (let i = 0; i < S.length; i++) {
            const s = S[i];
            const r = s.getBoundingClientRect();
            const d = Math.hypot(
              mx - (r.left + r.width / 2),
              my - (r.top + r.height / 2),
            );
            const k = Math.max(0, 1 - d / 280);
            s.style.fontVariationSettings = `"wght" ${(300 + 500 * k) | 0}`;
            s.style.color = k > 0.55 ? "var(--accent)" : "";
          }
        }

        addEventListener(
          "pointermove",
          (e) => {
            mx = e.clientX;
            my = e.clientY;
            requestFrame();
          },
          { passive: true },
        );
        requestFrame();
      })();
    </script>
  </body>
</html>
