<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Page not found.">
  <meta name="theme-color" content="#efede7">

  <title>404 — 4ofl.dev</title>

  <style>
    :root {
      --bg: #efede7;
      --ink: #121212;
      --muted: #6d6a64;
      --accent: #2857ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family:
        Arial,
        Helvetica,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: white;
      background: var(--accent);
    }

    .cursor-canvas {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main {
      width: min(760px, calc(100% - 40px));
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .code {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 16vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.085em;
      font-weight: 900;
    }

    p {
      margin: 28px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.15rem);
      line-height: 1.7;
    }

    a {
      position: relative;
      width: fit-content;
      margin-top: 34px;
      padding-bottom: 6px;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 800;
    }

    a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--accent);
      transform-origin: left;
      transition: transform 180ms ease;
    }

    a:hover::after {
      transform: scaleX(0.35);
    }

    @media (max-width: 680px) {
      main {
        width: min(100% - 28px, 760px);
      }
    }

    @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
      .cursor-canvas {
        display: none;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <canvas class="cursor-canvas" id="cursor-canvas" aria-hidden="true"></canvas>

  <main>
    <div class="code">404</div>
    <h1>lost.</h1>
    <p>this page does not exist.</p>
    <a href="/">home</a>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("cursor-canvas");
      const context = canvas.getContext("2d");
      const particles = Array.from({ length: 4 }, (_, index) => ({
        x: innerWidth / 2,
        y: innerHeight / 2,
        vx: 0,
        vy: 0,
        lag: 0.17 - index * 0.025
      }));

      const pointer = {
        x: innerWidth / 2,
        y: innerHeight / 2,
        lastMove: performance.now()
      };

      let width = 0;
      let height = 0;
      let ratio = 1;

      const resize = () => {
        ratio = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      };

      resize();
      addEventListener("resize", resize);

      addEventListener("pointermove", (event) => {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        pointer.lastMove = performance.now();
      }, { passive: true });

      const markOffsets = [
        [-8, -9],
        [-8, 0],
        [1, 0],
        [1, 10]
      ];

      const drawMark = (opacity) => {
        context.save();
        context.globalAlpha = opacity;
        context.strokeStyle = "#2857ff";
        context.lineWidth = 1.35;
        context.lineCap = "square";

        const [a, b, c, d] = particles;

        context.beginPath();
        context.moveTo(a.x, a.y);
        context.lineTo(b.x, b.y);
        context.lineTo(c.x, c.y);
        context.moveTo(c.x, c.y);
        context.lineTo(d.x, d.y);
        context.stroke();
        context.restore();
      };

      const frame = (time) => {
        context.clearRect(0, 0, width, height);

        const idle = time - pointer.lastMove > 520;
        const settle = Math.min(
          1,
          Math.max(0, (time - pointer.lastMove - 520) / 360)
        );

        particles.forEach((particle, index) => {
          const offset = idle ? markOffsets[index] : [0, 0];
          const targetX = pointer.x + offset[0];
          const targetY = pointer.y + offset[1];

          particle.vx += (targetX - particle.x) * particle.lag;
          particle.vy += (targetY - particle.y) * particle.lag;
          particle.vx *= 0.72;
          particle.vy *= 0.72;
          particle.x += particle.vx;
          particle.y += particle.vy;

          context.fillStyle = index === 0 ? "#2857ff" : "#121212";
          context.fillRect(
            Math.round(particle.x) - 1.5,
            Math.round(particle.y) - 1.5,
            3,
            3
          );
        });

        if (idle) {
          drawMark(settle * 0.85);
        }

        requestAnimationFrame(frame);
      };

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
