<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 · lost in retrieval · 4ofl</title>
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="robots" content="noindex,follow" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --ink: #0b0b0d;
        --bone: #edece8;
        --mist: #8c8a85;
        --line: #ffffff1a;
        --accent: #d47455;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        background: var(--ink);
      }
      body {
        min-height: 100svh;
        color: var(--bone);
        font:
          400 0.85rem/1.6 "JetBrains Mono",
          ui-monospace,
          monospace;
        display: grid;
        place-items: center;
        padding: 5rem 1.25rem 3rem;
      }
      ::selection {
        background: var(--accent);
        color: var(--ink);
      }
      a {
        color: var(--accent);
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .logo {
        position: fixed;
        top: 1rem;
        left: clamp(1.25rem, 5vw, 4rem);
        font:
          800 1.3rem "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.04em;
        text-decoration: none;
        color: var(--bone);
      }
      .logo i {
        font-style: normal;
        color: var(--accent);
      }
      .wrap {
        position: relative;
        width: min(680px, 100%);
        display: grid;
        gap: 1.4rem;
      }
      .code {
        font:
          300 clamp(6rem, 26vw, 13rem)/0.8 "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.06em;
        user-select: none;
      }
      .code span {
        display: inline-block;
        transition:
          font-variation-settings 0.15s,
          color 0.2s;
      }
      h1 {
        font:
          600 clamp(1.8rem, 5vw, 2.8rem)/1.1 "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.03em;
      }
      h1 i {
        color: var(--accent);
      }
      .sub {
        color: var(--mist);
        max-width: 46ch;
      }
      .term {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff08;
        padding: 1.1rem;
        display: grid;
        gap: 0.9rem;
        backdrop-filter: blur(8px);
      }
      #out {
        display: grid;
        gap: 0.25rem;
        max-height: 18rem;
        overflow: auto;
        color: var(--mist);
        word-break: break-word;
      }
      #out .c {
        color: var(--bone);
      }
      #out .e {
        color: var(--accent);
      }
      .row {
        display: flex;
        gap: 0.6rem;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }
      .row input {
        flex: 1;
        background: none;
        border: 0;
        outline: 0;
        color: inherit;
        font: inherit;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .chips button {
        background: none;
        color: var(--mist);
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 0.3rem 0.8rem;
        cursor: pointer;
      }
      .chips button:hover {
        border-color: var(--accent);
        color: var(--bone);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <a class="logo" href="/">4ofl<i>.dev</i></a>
    <main class="wrap">
      <div class="code" id="code" aria-label="404">404</div>
      <h1>lost in <i>retrieval</i>.</h1>
      <p class="sub">
        zero documents matched this route. type a command below, or let the
        index guess where you meant to go.
      </p>
      <div class="term">
        <div id="out" aria-live="polite"></div>
        <div class="row">
          <span>&gt;</span
          ><input
            id="in"
            placeholder="try: help"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Terminal input"
          />
        </div>
        <div class="chips" id="chips">
          <button>help</button><button>ls</button><button>cd work</button
          ><button>home</button>
        </div>
      </div>
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (s) => document.querySelector(s),
          out = $("#out"),
          inp = $("#in");
        const R = [
          ["home", "/"],
          ["work", "/#work"],
          ["about", "/#about"],
          ["contact", "/#contact"],
          ["citecamp", "https://citecamp.4ofl.dev"],
          ["june", "https://docs.june.4ofl.dev"],
          ["github", "https://github.com/4ofl"],
        ];
        const lev = (a, b) => {
          const d = Array.from({ length: a.length + 1 }, (_, i) => [
            i,
            ...Array(b.length).fill(0),
          ]);
          for (let j = 1; j <= b.length; j++) d[0][j] = j;
          for (let i = 1; i <= a.length; i++)
            for (let j = 1; j <= b.length; j++)
              d[i][j] = Math.min(
                d[i - 1][j] + 1,
                d[i][j - 1] + 1,
                d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
              );
          return d[a.length][b.length];
        };
        const line = (t, c) => {
          const d = document.createElement("div");
          d.textContent = t;
          if (c) d.className = c;
          out.append(d);
          out.scrollTop = 1e9;
          return d;
        };
        const link = (label, href) => {
          const d = document.createElement("div"),
            a = document.createElement("a");
          a.href = href;
          a.textContent = label;
          if (href[0] !== "/") ((a.target = "_blank"), (a.rel = "noopener"));
          d.append("→ ", a);
          out.append(d);
          out.scrollTop = 1e9;
        };
        const go = (href) => {
          href[0] === "/"
            ? (location.href = href)
            : open(href, "_blank", "noopener");
        };

        const path = location.pathname,
          seg = decodeURIComponent(path.split("/").filter(Boolean).pop() || "")
            .toLowerCase()
            .replace(/\.\w+$/, "");
        line("> GET " + path, "c");
        line("< 404 NOT_FOUND [route_unresolved]", "e");
        line("< 0 documents retrieved");
        let best = null,
          bd = 99;
        for (const r of R) {
          const d = Math.min(
            lev(seg, r[0]),
            r[0].startsWith(seg) && seg ? 0 : 99,
          );
          if (d < bd) ((bd = d), (best = r));
        }
        if (seg && best && bd <= Math.max(2, seg.length / 2)) {
          line(`closest match: "${best[0]}" (distance ${bd})`);
          link(best[0], best[1]);
        } else {
          line("no close match. returning you home is the safest bet.");
          link("home", "/");
        }

        const run = (raw) => {
          const c = raw.trim();
          if (!c) return;
          line("> " + c, "c");
          const [cmd, ...a] = c.toLowerCase().split(/\s+/),
            arg = a.join(" ");
          if (cmd === "help")
            line("help · ls · cd <route> · home · whoami · date · clear");
          else if (cmd === "ls") R.forEach((r) => line("  " + r[0]));
          else if (cmd === "cd" || cmd === "open") {
            const r =
              R.find((x) => x[0] === arg) ||
              R.map((x) => [x, lev(arg, x[0])]).sort(
                (p, q) => p[1] - q[1],
              )[0]?.[0];
            if (!arg) line("cd: where to?", "e");
            else {
              line("resolving " + r[0] + "…");
              setTimeout(() => go(r[1]), 350);
            }
          } else if (cmd === "home") {
            line("returning…");
            setTimeout(() => go("/"), 300);
          } else if (cmd === "whoami")
            line(
              "a visitor on a route that doesn't exist. aby mathew built this index.",
            );
          else if (cmd === "date") line(new Date().toISOString());
          else if (cmd === "clear") out.innerHTML = "";
          else if (cmd === "sudo")
            line("nice try. this index is read-only.", "e");
          else if (cmd === "rm")
            line(
              "rm: refusing. you already found one thing that's missing.",
              "e",
            );
          else {
            const m = ["help", "ls", "cd", "home", "whoami", "date", "clear"]
              .map((x) => [x, lev(cmd, x)])
              .sort((p, q) => p[1] - q[1])[0];
            line(
              `${cmd}: command not found${m[1] <= 2 ? ` · did you mean "${m[0]}"?` : ""}`,
              "e",
            );
          }
        };
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            run(inp.value);
            inp.value = "";
          }
        });
        $("#chips").addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON") run(e.target.textContent);
        });
        addEventListener("keydown", (e) => {
          if (e.key === "Escape") location.href = "/";
        });
        if (matchMedia("(pointer:fine)").matches) inp.focus();

        /* big 404 reacts to cursor + dot grid */
        const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
        const code = $("#code");
        code.innerHTML = [..."404"].map((c) => `<span>${c}</span>`).join("");
        const S = [...code.children];
        let mx = -999,
          my = -999;
        addEventListener(
          "pointermove",
          (e) => {
            mx = e.clientX;
            my = e.clientY;
          },
          { passive: true },
        );
        const cv = $("#bg"),
          g = cv.getContext("2d");
        let W, H, D;
        const size = () => {
          D = Math.min(devicePixelRatio || 1, 2);
          W = cv.width = innerWidth * D;
          H = cv.height = innerHeight * D;
        };
        size();
        addEventListener("resize", size);
        document.fonts.ready.then(() => {
          S.forEach((s) => {
            s.style.fontVariationSettings = '"wght" 800';
            s.style.width = s.getBoundingClientRect().width + "px";
            s.style.fontVariationSettings = '"wght" 300';
          });
        });
        function frame() {
          g.clearRect(0, 0, W, H);
          const gap = 34 * D;
          for (let y = gap / 2; y < H; y += gap)
            for (let x = gap / 2; x < W; x += gap) {
              const k = Math.max(
                0,
                1 - Math.hypot(x / D - mx, y / D - my) / 230,
              );
              g.fillStyle = k
                ? `rgba(212,116,85,${0.2 + 0.8 * k})`
                : "rgba(255,255,255,.09)";
              g.beginPath();
              g.arc(x, y, (1 + 2.4 * k) * D, 0, 6.3);
              g.fill();
            }
          for (const s of S) {
            const r = s.getBoundingClientRect(),
              k = Math.max(
                0,
                1 -
                  Math.hypot(
                    mx - r.left - r.width / 2,
                    my - r.top - r.height / 2,
                  ) /
                    300,
              );
            s.style.fontVariationSettings = `"wght" ${(300 + 500 * k) | 0}`;
            s.style.color = k > 0.55 ? "var(--accent)" : "";
          }
          if (!reduce) requestAnimationFrame(frame);
        }
        frame();
      })();
    </script>
  </body>
</html>
