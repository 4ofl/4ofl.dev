<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 · lost in retrieval · 4ofl</title>
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="404: route not found on 4ofl.dev. an interactive terminal memory dump." />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://4ofl.dev/404.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://4ofl.dev/404.html" />
    <meta property="og:title" content="404 · lost in retrieval · 4ofl" />
    <meta property="og:description" content="route not found on 4ofl.dev. interactive terminal memory dump." />
    <meta property="og:image" content="https://4ofl.dev/assets/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="404 · lost in retrieval · 4ofl" />
    <meta name="twitter:description" content="route not found on 4ofl.dev. interactive terminal memory dump." />
    <meta name="twitter:image" content="https://4ofl.dev/assets/social-card.png" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url("/assets/fonts/bricolage-grotesque.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url("/assets/fonts/jetbrains-mono-400.woff2") format("woff2");
      }
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.22s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }

      :root {
        --ink: #0b0b0d;
        --bone: #edece8;
        --mist: #8c8a85;
        --line: #ffffff1a;
        --accent: #d47455;
        --pad: clamp(1.25rem, 5vw, 4rem);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        background: var(--ink);
        scroll-behavior: smooth;
      }
      body {
        min-height: 100svh;
        color: var(--bone);
        font:
          400 0.85rem/1.6 "JetBrains Mono",
          ui-monospace,
          monospace;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent);
        color: var(--ink);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Original standalone logo */
      .logo {
        position: fixed;
        top: 1.25rem;
        left: var(--pad);
        z-index: 20;
        font:
          800 1.3rem "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.04em;
        color: var(--bone);
      }
      .logo i {
        font-style: normal;
        color: var(--accent);
      }

      /* Fullscreen layout */
      .hero-404 {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: clamp(2rem, 5vw, 4.5rem);
        align-items: center;
        padding: 5rem var(--pad) 3rem;
      }

      .meta-col {
        display: grid;
        gap: 1.2rem;
        align-content: center;
      }
      .code {
        font:
          300 clamp(6rem, 16vw, 12rem)/0.8 "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.06em;
        user-select: none;
      }
      .code span {
        display: inline-block;
        transition:
          font-variation-settings 0.15s,
          color 0.2s;
      }
      h1 {
        font:
          600 clamp(1.8rem, 4vw, 2.8rem)/1.15 "Bricolage Grotesque",
          sans-serif;
        letter-spacing: -0.03em;
      }
      h1 i {
        color: var(--accent);
        font-style: normal;
      }
      .sub {
        color: var(--mist);
        max-width: 44ch;
        line-height: 1.6;
      }
      .quick-nav {
        margin-top: 0.4rem;
      }
      .btn-main {
        display: inline-block;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
        padding: 0.45rem 1.1rem;
        border-radius: 99px;
        background: var(--accent);
        color: var(--ink);
        font-weight: 500;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .btn-main:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      /* Solid opaque terminal surface */
      .term-col {
        width: 100%;
      }
      .term {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #121215;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        padding: 1.3rem;
        display: grid;
        gap: 0.9rem;
        position: relative;
        z-index: 2;
      }
      .term-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.65rem;
        font-size: 0.75rem;
        color: var(--mist);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      #out {
        display: grid;
        gap: 0.3rem;
        min-height: 12rem;
        max-height: 19rem;
        overflow-y: auto;
        color: var(--mist);
        word-break: break-word;
        padding-top: 0.25rem;
        padding-right: 0.5rem;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      #out::-webkit-scrollbar {
        width: 5px;
      }
      #out::-webkit-scrollbar-track {
        background: transparent;
      }
      #out::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }
      #out::-webkit-scrollbar-thumb:hover {
        background: var(--mist);
      }
      #out .c {
        color: var(--bone);
      }
      #out .e {
        color: var(--accent);
      }
      #out a {
        color: var(--accent);
        text-decoration: underline;
      }

      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }
      .row span {
        color: var(--accent);
      }
      .row input {
        flex: 1;
        background: none;
        border: 0;
        outline: 0;
        color: inherit;
        font: inherit;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .chips button {
        background: #18181c;
        color: var(--mist);
        font: inherit;
        font-size: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 0.3rem 0.8rem;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .chips button:hover {
        border-color: var(--accent);
        color: var(--bone);
      }

      @media (max-width: 880px) {
        .hero-404 {
          grid-template-columns: 1fr;
          padding-top: 5rem;
          gap: 2rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <a class="logo" href="/">4ofl<i>.dev</i></a>

    <main class="hero-404">
      <div class="meta-col">
        <div class="code" id="code" aria-label="404">404</div>
        <h1>lost in <i>retrieval</i>.</h1>
        <p class="sub">
          zero documents matched this route. type a command in the terminal
          below, or jump back to an active route.
        </p>
        <div class="quick-nav">
          <a href="/" class="btn-main" id="homeBtn">home ↗</a>
        </div>
      </div>

      <div class="term-col">
        <div class="term">
          <div class="term-head">
            <span>index gateway</span>
            <span class="status-dot"></span>
          </div>
          <div id="out" aria-live="polite"></div>
          <div class="row">
            <span>&gt;</span>
            <input
              id="in"
              placeholder="try: help"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="terminal input"
            />
          </div>
          <div class="chips" id="chips">
            <button>help</button>
            <button>ls</button>
            <button>cd work</button>
            <button>home</button>
            <button>neofetch</button>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/404.js" defer></script>
  </body>
</html>
