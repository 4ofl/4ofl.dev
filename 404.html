<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Page not found.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#efede7">
  <title>404 — 4ofl.dev</title>

  <script>
    try {
      var s = localStorage.getItem("4ofl-theme");
      var t = s === "dark" || s === "light" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0f0f0e" : "#efede7");
    } catch (e) {}
  </script>

  <!-- absolute paths: the 404 page is served from any URL depth -->
  <link rel="stylesheet" href="/style.css">
</head>

      </button>
